<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undertow</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
        
        /* Экран входа через Telegram */
        .auth-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; gap: 20px; }
        .auth-screen.hidden { display: none; }
        .auth-logo { width: 80px; height: 80px; border-radius: 22px; background: linear-gradient(135deg, #0088cc, #00f2fe); display: flex; align-items: center; justify-content: center; font-size: 38px; box-shadow: 0 10px 30px rgba(0, 136, 204, 0.4); }
        .auth-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .auth-sub { font-size: 14px; color: #8e8e93; max-width: 280px; line-height: 1.4; }
        .tg-login-btn { background: #2481cc; color: #fff; border: none; padding: 14px 24px; border-radius: 14px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer; width: 100%; max-width: 280px; justify-content: center; transition: transform 0.1s; }
        .tg-login-btn:active { transform: scale(0.97); }
        .guest-btn { background: none; border: none; color: #666; font-size: 13px; cursor: pointer; margin-top: 8px; }

        /* Вкладки (Лента / Профиль) */
        .tab-view { display: none; width: 100%; height: calc(100vh - 60px); }
        .tab-view.active { display: block; }

        /* Вертикальная лента */
        .feed { width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .feed::-webkit-scrollbar { display: none; }
        
        .video-card { position: relative; width: 100%; height: 100%; scroll-snap-align: start; background: #0a0a0a; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Информация о видео */
        .video-info { position: absolute; bottom: 25px; left: 15px; right: 75px; z-index: 10; text-shadow: 0 1px 4px rgba(0,0,0,0.9); pointer-events: none; }
        .author-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; pointer-events: auto; }
        .author-name { font-weight: 700; font-size: 16px; }
        .promo-badge { background: linear-gradient(45deg, #ffaa00, #ff5500); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 6px; text-transform: uppercase; }
        .sub-btn { background: #ff2b54; color: #fff; border: none; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .sub-btn.subscribed { background: rgba(255,255,255,0.22); backdrop-filter: blur(4px); }
        .video-desc { font-size: 14px; line-height: 1.35; }
        
        /* Правая панель действий */
        .actions { position: absolute; bottom: 30px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 18px; align-items: center; }
        .action-btn { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .action-icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(25,25,25,0.6); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 20px; backdrop-filter: blur(6px); }
        .action-btn.liked .action-icon { color: #ff2b54; border-color: rgba(255,43,84,0.4); }
        .action-count { font-size: 12px; font-weight: 600; }
        
        /* Профиль */
        .profile-page { padding: 24px 16px; overflow-y: auto; background: #000; }
        .profile-header { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px; padding-top: 10px; }
        .avatar { width: 84px; height: 84px; border-radius: 50%; background: #222; object-fit: cover; border: 2px solid #2481cc; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; }
        .profile-name { font-size: 20px; font-weight: 700; }
        .profile-tag { font-size: 13px; color: #8e8e93; }
        .stats-row { display: flex; gap: 24px; margin-top: 8px; background: #141416; padding: 12px 24px; border-radius: 16px; border: 1px solid #222; }
        .stat-box { text-align: center; }
        .stat-num { font-size: 17px; font-weight: 700; }
        .stat-label { font-size: 11px; color: #8e8e93; }
        .my-videos-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #ccc; }
        .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .grid-item { aspect-ratio: 9/16; background: #1c1c1e; border-radius: 6px; overflow: hidden; position: relative; }
        .grid-item video { width: 100%; height: 100%; object-fit: cover; }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: rgba(10,10,10,0.95); border-top: 1px solid #1f1f1f; display: flex; justify-content: space-around; align-items: center; z-index: 20; }
        .nav-item { color: #777; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: #fff; font-weight: 600; }
        .nav-icon { font-size: 18px; }
        .add-btn { background: linear-gradient(45deg, #00f2fe, #ff2b54); width: 46px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; font-weight: bold; }
        
        /* Модальные окна */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal.open { display: flex; }
        .modal-box { background: #1c1c1e; width: 100%; max-width: 360px; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #2c2c2e; }
        .modal-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 4px; }
        input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #333; background: #2c2c2e; color: #fff; font-size: 14px; outline: none; }
        .file-label { display: block; padding: 14px; border: 1px dashed #2481cc; border-radius: 12px; text-align: center; color: #5ac8fa; font-size: 14px; font-weight: 600; cursor: pointer; background: rgba(36, 129, 204, 0.1); }
        .btn-primary { background: #2481cc; color: #fff; border: none; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary:disabled { opacity: 0.5; }
        .btn-star { background: linear-gradient(45deg, #f5af19, #f12711); color: #fff; border: none; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-close { background: #2c2c2e; color: #aaa; border: none; padding: 11px; border-radius: 12px; cursor: pointer; font-size: 14px; }
        .empty-msg { text-align: center; color: #666; padding: 40px 20px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Нативный экран входа по Telegram -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-logo">🌊</div>
        <div class="auth-title">Undertow</div>
        <div class="auth-sub">Вертикальная лента видео, донаты авторам и продвижение внутри Telegram</div>
        <button class="tg-login-btn" onclick="loginWithTelegram()">
            <span>✈️</span> Войти через Telegram
        </button>
        <button class="guest-btn" onclick="loginAsGuest()">Продолжить без аккаунта</button>
    </div>

    <!-- Вкладка 1: Лента -->
    <div class="tab-view active" id="feedView">
        <div class="feed" id="feed"></div>
    </div>

    <!-- Вкладка 2: Профиль -->
    <div class="tab-view profile-page" id="profileView">
        <div class="profile-header">
            <div class="avatar" id="profileAvatar">👤</div>
            <div class="profile-name" id="profileName">Загрузка...</div>
            <div class="profile-tag" id="profileTag">@username</div>
            <div class="stats-row">
                <div class="stat-box"><div class="stat-num" id="statVideos">0</div><div class="stat-label">Видео</div></div>
                <div class="stat-box"><div class="stat-num" id="statLikes">0</div><div class="stat-label">Лайков</div></div>
                <div class="stat-box"><div class="stat-num" id="statSubs">0</div><div class="stat-label">Подписок</div></div>
            </div>
        </div>
        <div class="my-videos-title">Мои публикации</div>
        <div class="video-grid" id="myVideosGrid"></div>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-nav">
        <button class="nav-item active" id="navFeed" onclick="switchTab('feed', 'all')"><span class="nav-icon">🏠</span><span>Лента</span></button>
        <button class="nav-item" id="navSubs" onclick="switchTab('feed', 'subs')"><span class="nav-icon">👥</span><span>Подписки</span></button>
        <button class="nav-item" onclick="openModal('uploadModal')"><div class="add-btn">+</div></button>
        <button class="nav-item" id="navProfile" onclick="switchTab('profile')"><span class="nav-icon">👤</span><span>Профиль</span></button>
    </div>

    <!-- Окно загрузки видео -->
    <div class="modal" id="uploadModal">
        <div class="modal-box">
            <div class="modal-title">Опубликовать видео</div>
            <label class="file-label" for="videoFileInput" id="fileLabelText">📁 Выбрать видео с устройства (.mp4 / .mov)</label>
            <input type="file" id="videoFileInput" accept="video/*" style="display:none" onchange="handleFileSelect(this)">
            <input type="url" id="videoUrlInput" placeholder="Или вставь прямую ссылку на .mp4">
            <textarea id="videoDescInput" rows="2" placeholder="Напиши описание к видео..."></textarea>
            <button class="btn-primary" id="publishBtn" onclick="publishVideo()">Опубликовать</button>
            <button class="btn-close" onclick="closeModal('uploadModal')">Отмена</button>
        </div>
    </div>

    <!-- Окно доната и продвижения -->
    <div class="modal" id="starModal">
        <div class="modal-box">
            <div class="modal-title">Поддержка и продвижение</div>
            <input type="number" id="donateAmount" value="50" min="1" placeholder="Количество звёзд">
            <button class="btn-star" onclick="sendAction('donate')">⭐ Отправить донат автору</button>
            <button class="btn-primary" onclick="sendAction('promote')">🚀 Продвинуть в ТОП (10 ⭐)</button>
            <button class="btn-close" onclick="closeModal('starModal')">Закрыть</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pgnqjobutdlaxtjrrxio.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_dtl6T4d7C-RROlkZBW7JsA_qNW9XaTF';
        const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/undertow-api`;

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let currentUser = null;
        let videos = [];
        let activeVideoId = null;

        // Автоматический вход, если открыто из Telegram
        function initAuth() {
            const tgUser = tg?.initDataUnsafe?.user;
            const savedUser = JSON.parse(localStorage.getItem('undertow_user') || 'null');

            if (tgUser) {
                setUser({
                    id: tgUser.id,
                    username: tgUser.username ? `@${tgUser.username}` : `id${tgUser.id}`,
                    first_name: tgUser.first_name || 'Пользователь',
                    photo_url: tgUser.photo_url || ''
                });
                document.getElementById('authScreen').classList.add('hidden');
            } else if (savedUser) {
                setUser(savedUser);
                document.getElementById('authScreen').classList.add('hidden');
            }
        }

        function loginWithTelegram() {
            const tgUser = tg?.initDataUnsafe?.user;
            if (tgUser) {
                setUser({
                    id: tgUser.id,
                    username: tgUser.username ? `@${tgUser.username}` : `id${tgUser.id}`,
                    first_name: tgUser.first_name || 'Пользователь',
                    photo_url: tgUser.photo_url || ''
                });
                document.getElementById('authScreen').classList.add('hidden');
            } else {
                // Если открыли в обычном браузере — перенаправляем в бота для нативного входа
                if (tg && tg.showAlert) {
                    tg.showAlert('Для входа через Telegram открой приложение через синюю кнопку меню в боте @undertow_vids_bot');
                } else {
                    window.location.href = 'https://t.me/undertow_vids_bot';
                }
            }
        }

        function loginAsGuest() {
            setUser({ id: 999000, username: '@guest', first_name: 'Гость', photo_url: '' });
            document.getElementById('authScreen').classList.add('hidden');
        }

        async function setUser(user) {
            currentUser = user;
            localStorage.setItem('undertow_user', JSON.stringify(user));
            updateProfileUI();

            // Сохраняем/обновляем пользователя в Supabase
            if (user.id !== 999000) {
                fetch(`${SUPABASE_URL}/rest/v1/users`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'resolution=merge-duplicates'
                    },
                    body: JSON.stringify({
                        user_id: String(user.id),
                        username: user.username,
                        avatar_url: user.photo_url || ''
                    })
                }).catch(() => {});
            }
        }

        function updateProfileUI() {
            if (!currentUser) return;
            document.getElementById('profileName').textContent = currentUser.first_name;
            document.getElementById('profileTag').textContent = `${currentUser.username} • ID: ${currentUser.id}`;
            const avatarEl = document.getElementById('profileAvatar');
            if (currentUser.photo_url) {
                avatarEl.innerHTML = `<img src="${currentUser.photo_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                avatarEl.textContent = currentUser.first_name[0]?.toUpperCase() || '👤';
            }
        }

        async function loadVideos() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=is_promoted.desc,created_at.desc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                if (Array.isArray(data)) {
                    videos = data.filter(v => v.video_url);
                }
            } catch (e) {
                console.error(e);
            }
            renderFeed(videos);
            renderProfileVideos();
        }

        function renderFeed(list) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            if (!list.length) {
                feed.innerHTML = '<div class="empty-msg">Пока нет видео. Нажми <b>+</b> внизу, чтобы загрузить первое!</div>';
                return;
            }

            const subs = JSON.parse(localStorage.getItem('undertow_subs') || '[]');
            const liked = JSON.parse(localStorage.getItem('undertow_likes') || '[]');

            list.forEach(v => {
                const authorId = v.author_id || v.user_id;
                const isSub = subs.includes(String(authorId));
                const isLiked = liked.includes(String(v.id));
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <video src="${v.video_url}" loop playsinline onclick="togglePlay(this)"></video>
                    <div class="video-info">
                        <div class="author-row">
                            <span class="author-name">${v.author_name || '@user'}</span>
                            ${v.is_promoted ? '<span class="promo-badge">ТОП</span>' : ''}
                            <button class="sub-btn ${isSub ? 'subscribed' : ''}" onclick="toggleSub('${authorId}', this)">
                                ${isSub ? 'Вы подписаны' : 'Подписаться'}
                            </button>
                        </div>
                        <div class="video-desc">${v.description || ''}</div>
                    </div>
                    <div class="actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${v.id}', ${v.likes || 0}, this)">
                            <div class="action-icon">❤️</div>
                            <span class="action-count">${v.likes || 0}</span>
                        </button>
                        <button class="action-btn" onclick="openStarModal('${v.id}')">
                            <div class="action-icon">⭐</div>
                            <span class="action-count">Звёзды</span>
                        </button>
                    </div>
                `;
                feed.appendChild(card);
            });
            setupAutoPlay();
        }

        function renderProfileVideos() {
            if (!currentUser) return;
            const myVids = videos.filter(v => String(v.author_id || v.user_id) === String(currentUser.id));
            const totalLikes = myVids.reduce((acc, v) => acc + (v.likes || 0), 0);
            const subs = JSON.parse(localStorage.getItem('undertow_subs') || '[]');

            document.getElementById('statVideos').textContent = myVids.length;
            document.getElementById('statLikes').textContent = totalLikes;
            document.getElementById('statSubs').textContent = subs.length;

            const grid = document.getElementById('myVideosGrid');
            grid.innerHTML = '';
            myVids.forEach(v => {
                const item = document.createElement('div');
                item.className = 'grid-item';
                item.innerHTML = `<video src="${v.video_url}#t=0.5" muted preload="metadata"></video>`;
                grid.appendChild(item);
            });
        }

        function setupAutoPlay() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (!video) return;
                    if (entry.isIntersecting) {
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.65 });

            document.querySelectorAll('.video-card').forEach(card => observer.observe(card));
        }

        function togglePlay(video) {
            video.paused ? video.play() : video.pause();
        }

        async function toggleLike(id, currentLikes, btn) {
            let liked = JSON.parse(localStorage.getItem('undertow_likes') || '[]');
            const countEl = btn.querySelector('.action-count');
            let count = parseInt(countEl.textContent);
            const strId = String(id);

            if (liked.includes(strId)) {
                liked = liked.filter(x => x !== strId);
                btn.classList.remove('liked');
                count = Math.max(0, count - 1);
            } else {
                liked.push(strId);
                btn.classList.add('liked');
                count = count + 1;
            }
            countEl.textContent = count;
            localStorage.setItem('undertow_likes', JSON.stringify(liked));

            fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${id}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ likes: count })
            }).catch(() => {});
        }

        function toggleSub(authorId, btn) {
            let subs = JSON.parse(localStorage.getItem('undertow_subs') || '[]');
            const strId = String(authorId);
            if (subs.includes(strId)) {
                subs = subs.filter(x => x !== strId);
                btn.textContent = 'Подписаться';
                btn.classList.remove('subscribed');
            } else {
                subs.push(strId);
                btn.textContent = 'Вы подписаны';
                btn.classList.add('subscribed');
            }
            localStorage.setItem('undertow_subs', JSON.stringify(subs));
            renderProfileVideos();
        }

        function switchTab(tab, filter = 'all') {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));

            if (tab === 'profile') {
                document.getElementById('navProfile').classList.add('active');
                document.getElementById('profileView').classList.add('active');
                renderProfileVideos();
            } else {
                document.getElementById('feedView').classList.add('active');
                if (filter === 'subs') {
                    document.getElementById('navSubs').classList.add('active');
                    const subs = JSON.parse(localStorage.getItem('undertow_subs') || '[]');
                    renderFeed(videos.filter(v => subs.includes(String(v.author_id || v.user_id))));
                } else {
                    document.getElementById('navFeed').classList.add('active');
                    renderFeed(videos);
                }
            }
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                document.getElementById('fileLabelText').textContent = `✅ Выбран: ${input.files[0].name}`;
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('open'); }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }
        function openStarModal(videoId) { activeVideoId = videoId; openModal('starModal'); }

        async function publishVideo() {
            const fileInput = document.getElementById('videoFileInput');
            let url = document.getElementById('videoUrlInput').value.trim();
            const desc = document.getElementById('videoDescInput').value.trim();
            const btn = document.getElementById('publishBtn');

            if (!fileInput.files[0] && !url) {
                return alert('Выбери файл с устройства или вставь ссылку на .mp4!');
            }

            btn.disabled = true;
            btn.textContent = 'Загрузка...';

            try {
                // Если выбран файл с устройства — загружаем в Supabase Storage (bucket: videos)
                if (fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '')}`;
                    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/videos/${fileName}`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': file.type || 'video/mp4'
                        },
                        body: file
                    });

                    if (!uploadRes.ok) {
                        const err = await uploadRes.json();
                        throw new Error(err.message || 'Ошибка загрузки файла в Storage');
                    }
                    url = `${SUPABASE_URL}/storage/v1/object/public/videos/${fileName}`;
                }

                const userId = currentUser ? currentUser.id : 999000;
                const authorName = currentUser ? currentUser.username : '@guest';

                const payload = {
                    user_id: String(userId),
                    author_id: Number(userId),
                    author_name: authorName,
                    description: desc,
                    video_url: url,
                    likes: 0,
                    is_promoted: false
                };

                const dbRes = await fetch(`${SUPABASE_URL}/rest/v1/videos`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(payload)
                });

                if (!dbRes.ok) {
                    const err = await dbRes.json();
                    throw new Error(err.message || 'Ошибка сохранения в базу');
                }

                document.getElementById('videoUrlInput').value = '';
                document.getElementById('videoDescInput').value = '';
                fileInput.value = '';
                document.getElementById('fileLabelText').textContent = '📁 Выбрать видео с устройства (.mp4 / .mov)';
                closeModal('uploadModal');
                await loadVideos();
            } catch (e) {
                alert('Ошибка загрузки: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Опубликовать';
            }
        }

        async function sendAction(type) {
            const stars = type === 'promote' ? 10 : parseInt(document.getElementById('donateAmount').value || 50);
            try {
                const res = await fetch(FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: type,
                        video_id: activeVideoId,
                        user_id: currentUser?.id,
                        stars: stars
                    })
                });
                const data = await res.json();
                if (data.invoice_url && tg?.openInvoice) {
                    tg.openInvoice(data.invoice_url, (status) => {
                        if (status === 'paid') loadVideos();
                    });
                } else {
                    alert(data.error || 'Не удалось создать счёт на оплату звёздами. Проверь Edge Function undertow-api.');
                }
            } catch (e) {
                alert('Ошибка соединения с сервером оплаты.');
            }
            closeModal('starModal');
        }

        initAuth();
        loadVideos();
    </script>
</body>
</html>
