async function extractFrames(file) {
return new Promise((resolve) => {
const vid = document.createElement('video');
vid.preload = 'metadata';
vid.muted = true;
vid.playsInline = true;
const url = URL.createObjectURL(file);
vid.src = url;
vid.onloadedmetadata = async () => {
const canvas = document.createElement('canvas');
canvas.width = 320;
canvas.height = 568;
const ctx = canvas.getContext('2d');
const frames = [];
const dur = vid.duration || 1;
for (const ratio of [0.15, 0.5, 0.85]) {
vid.currentTime = dur * ratio;
await new Promise((r) => { vid.onseeked = r; });
ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
frames.push(canvas.toDataURL('image/jpeg', 0.6));
}
URL.revokeObjectURL(url);
resolve(frames);
};
vid.onerror = () => { URL.revokeObjectURL(url); resolve([]); };
});
}
function uploadFileXHR(file, fileName, onProgress) {
return new Promise((resolve, reject) => {
const attempt = (r) => {
const xhr = new XMLHttpRequest();
xhr.open('POST', SUPABASE_URL + '/storage/v1/object/videos/' + encodeURIComponent(fileName), true);
xhr.setRequestHeader('apikey', SUPABASE_KEY);
xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
xhr.setRequestHeader('x-upsert', 'true');
xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');
xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100)); };
xhr.onload = () => { if (xhr.status >= 200 && xhr.status < 300) resolve(SUPABASE_URL + '/storage/v1/object/public/videos/' + fileName); else if (r > 0) setTimeout(() => attempt(r - 1), 700); else reject(); };
xhr.onerror = () => { if (r > 0) setTimeout(() => attempt(r - 1), 700); else reject(); };
xhr.send(file);
};
attempt(3);
});
}
async function publishVideoInstant() {
if (!selectedFile) return showToast('Выберите видео');

method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ action: 'moderate', frames, description: desc })
});
const modData = await modRes.json();
if (modData && modData.safe === false) {
btn.disabled = false;
btn.textContent = 'Опубликовать с ИИ-проверкой';
return showToast('❌ Отклонено ИИ: ' + (modData.reason || 'нарушение правил'));
}
} catch (e) {}
btn.disabled = false;
btn.textContent = 'Опубликовать с ИИ-проверкой';
const localBlobUrl = URL.createObjectURL(file);
const tempId = 'temp_' + Date.now();
allVideos.unshift({ id: tempId, user_id: currentUser.id, author_id: Number(currentUser.id), author_name: currentUser.name, video_url: localBlobUrl, description: desc, likes: 0, views: 1 });
closeSheet('uploadSheet');
viewedProfileId = currentUser.id;
switchMainView('feed');
renderFeed(true);
haptic('heavy');
const b = document.getElementById('uploadBanner'), f = document.getElementById('uploadFill'), p = document.getElementById('uploadPercent');

try {

const fileName = currentUser.id + '_' + Date.now() + '.' + ext;
const publicUrl = await uploadFileXHR(file, fileName, (pct) => { f.style.width = pct + '%'; p.textContent = pct + '%'; });
let savedRow = null;
const insRes = await fetch(SUPABASE_URL + '/rest/v1/videos', { method: 'POST', headers: { ...headers, 'Prefer': 'return=representation' }, body: JSON.stringify({ user_id: currentUser.id, author_id: Number(currentUser.id), author_name: currentUser.name, video_url: publicUrl, description: desc, likes: 0, views: 0 }) });
if (insRes.ok) {
const rows = await insRes.json();
savedRow = rows.at(0) || null;
}
if (savedRow) {
const idx = allVideos.findIndex(x => x.id === tempId);
if (idx !== -1) allVideos[idx] = savedRow;
URL.revokeObjectURL(localBlobUrl);
updateSearchTags();
renderFeed(true);
}
showToast('✅ Опубликовано');
} catch (err) {
showToast('Ошибка сети');
allVideos = allVideos.filter(x => x.id !== tempId);
renderFeed(true);
} finally {
setTimeout(() => { b.style.display = 'none'; f.style.width = '0%'; }, 1000);
}
}
